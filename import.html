<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นำเข้าฐานข้อมูล DOPA NASAN Score 2570 (V.Pro)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style> 
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; } 
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-3xl border-t-4 border-indigo-600">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-database"></i></div>
            <div>
                <h2 class="text-2xl font-bold text-slate-800">เครื่องมือนำเข้าข้อมูลอัจฉริยะ</h2>
                <p class="text-sm text-slate-500">สำหรับไฟล์ DOPA NASAN Score 2570.xlsx</p>
            </div>
        </div>
        
        <div id="authWarning" class="hidden mt-4 mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl">
            <h3 class="text-red-800 font-bold text-sm"><i class="fa-solid fa-triangle-exclamation"></i> พบปัญหาการเชื่อมต่อ Firebase</h3>
            <p class="text-sm text-red-600 mt-1" id="authErrorText"></p>
        </div>

        <div class="mt-6">
            <input type="file" id="excelFile" accept=".xlsx, .xls" class="w-full p-4 border-2 border-dashed border-slate-300 rounded-xl mb-4 bg-slate-50 cursor-pointer text-sm font-bold text-slate-600 hover:bg-slate-100 hover:border-indigo-400 transition outline-none">
            
            <button onclick="startImport()" id="importBtn" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg active:scale-95 text-base flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> เริ่มอ่านไฟล์และนำเข้าข้อมูล
            </button>
        </div>

        <div id="statusArea" class="mt-8 hidden">
            <div class="flex justify-between text-sm font-bold text-slate-700 mb-2">
                <span>สถานะการทำงาน:</span>
                <span id="progressText" class="text-indigo-600">กำลังเตรียมการ...</span>
            </div>
            
            <div class="w-full bg-slate-100 rounded-full h-3 mb-3 shadow-inner overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-purple-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <div id="logArea" class="p-4 bg-slate-900 text-emerald-400 font-mono text-[11px] md:text-xs h-64 overflow-y-auto rounded-xl custom-scroll shadow-inner leading-relaxed"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBPC8Wcv5InhI9O-2aMfvclF3fBtqSo1xo",
          authDomain: "dopa-nasan-score.firebaseapp.com",
          projectId: "dopa-nasan-score",
          storageBucket: "dopa-nasan-score.firebasestorage.app",
          messagingSenderId: "678813152611",
          appId: "1:678813152611:web:959239d16e296a16cc0f56",
          measurementId: "G-4QN247NQTT"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const basePath = `artifacts/dopa-nasan-score/public/data`;

        function log(msg, type='normal') {
            const l = document.getElementById('logArea');
            let color = 'text-emerald-400';
            if (type === 'error') color = 'text-red-400 font-bold';
            if (type === 'info') color = 'text-sky-300';
            if (type === 'warn') color = 'text-amber-300';
            if (type === 'success') color = 'text-yellow-300 font-bold';
            l.innerHTML += `<div class="${color} mb-1.5">> ${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }

        async function checkAuthAndFirestore() {
            try {
                await auth.signInAnonymously();
                return true;
            } catch (error) {
                document.getElementById('authWarning').classList.remove('hidden');
                if (error.code === 'auth/operation-not-allowed') {
                    document.getElementById('authErrorText').innerHTML = "คุณลืมเปิดใช้งานการล็อกอินแบบไม่ระบุตัวตน (Anonymous)!<br><b>วิธีแก้:</b> ไปที่ Firebase Console > Authentication > Sign-in method > กด Add new provider > เลือก <b>Anonymous</b> และกด <b>Enable</b> จากนั้นกด Save แล้วกลับมากดนำเข้าใหม่ครับ";
                } else {
                    document.getElementById('authErrorText').innerText = "ข้อผิดพลาดระบบ: " + error.message;
                }
                return false;
            }
        }

        async function commitBatches(operations) {
            let batch = db.batch();
            let count = 0;
            let batchCount = 1;
            
            for(let op of operations) {
                batch.set(op.ref, op.data);
                count++;
                if(count === 400) {
                    log(`กำลังบันทึกชุดข้อมูลที่ ${batchCount} สู่ Firebase...`, 'info');
                    await batch.commit();
                    batch = db.batch();
                    count = 0;
                    batchCount++;
                }
            }
            if(count > 0) {
                log(`กำลังบันทึกชุดข้อมูลสุดท้าย...`, 'info');
                await batch.commit();
            }
        }

        const cleanStr = (val) => String(val || '').trim();
        const cleanNum = (val) => parseFloat(val) || 0;

        async function startImport() {
            const fileInput = document.getElementById('excelFile');
            if (!fileInput.files.length) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกไฟล์ Excel ก่อนครับ', 'warning');

            const btn = document.getElementById('importBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบระบบ...';
            document.getElementById('statusArea').classList.remove('hidden');
            document.getElementById('authWarning').classList.add('hidden');
            document.getElementById('logArea').innerHTML = '';

            const isAuthOk = await checkAuthAndFirestore();
            if (!isAuthOk) {
                btn.innerHTML = 'เกิดข้อผิดพลาด (ดูด้านบน)';
                btn.classList.replace('bg-indigo-600', 'bg-red-600');
                btn.disabled = false;
                return;
            }

            log('✅ เชื่อมต่อ Firebase และระบบยืนยันตัวตนสำเร็จ', 'success');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังอ่านแผ่นงานทั้งหมด...';

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    log(`พบแผ่นงาน: ${workbook.SheetNames.join(', ')}`, 'info');
                    
                    let operations = [];
                    
                    // Helper เพื่อหาชื่อ Sheet แบบยืดหยุ่น (ตัวพิมพ์เล็ก/ใหญ่ หรือมีเว้นวรรค)
                    const getSheet = (keyword) => workbook.SheetNames.find(n => n.toLowerCase().includes(keyword.toLowerCase()));

                    // 1. bookkon
                    const sBookkon = getSheet('bookkon');
                    if (sBookkon) {
                        log(`กำลังเตรียมข้อมูลบุคลากร [${sBookkon}]...`);
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sBookkon], { header: 1, defval: "" });
                        for (let i = 1; i < rows.length; i++) {
                            let r = rows[i];
                            if (!r[0]) continue;
                            let idCard = cleanStr(r[0]).replace(/\D/g, '');
                            let fullName = cleanStr(r[1]);
                            let moo = cleanStr(r[6]).replace(/\D/g, '');
                            let rawVillage = cleanStr(r[7]);
                            let data = {
                                idCard: idCard,
                                fullName: fullName,
                                position: cleanStr(r[2]),
                                moo: moo,
                                rawVillage: rawVillage,
                                village: rawVillage ? `หมู่ที่ ${moo} ${rawVillage}` : '',
                                subdistrict: cleanStr(r[8]),
                                totalScore: cleanNum(r[17])
                            };
                            operations.push({ ref: db.collection(`${basePath}/officials`).doc(idCard), data });
                        }
                    } else { log('ไม่พบแผ่นงาน bookkon (ข้าม)', 'warn'); }

                    // 2. score_logs
                    const sScore = getSheet('score_logs');
                    if (sScore) {
                        log(`กำลังเตรียมข้อมูลประวัติคะแนน [${sScore}]...`);
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sScore], { header: 1, defval: "" });
                        for (let i = 1; i < rows.length; i++) {
                            let r = rows[i];
                            if (!r[2]) continue;
                            let dateStr = cleanStr(r[1]);
                            let data = {
                                dateStr: dateStr,
                                idCard: cleanStr(r[2]).replace(/\D/g, ''),
                                fullName: cleanStr(r[3]),
                                categoryId: cleanStr(r[4]),
                                activityName: cleanStr(r[5]),
                                activityDetail: cleanStr(r[6]),
                                score: cleanNum(r[7]),
                                type: cleanStr(r[8]),
                                recordedBy: cleanStr(r[9]),
                                proofUrl: cleanStr(r[10]),
                                timestamp: dateStr ? firebase.firestore.Timestamp.fromDate(new Date(dateStr)) : firebase.firestore.FieldValue.serverTimestamp()
                            };
                            operations.push({ ref: db.collection(`${basePath}/score_logs`).doc(), data });
                        }
                    } else { log('ไม่พบแผ่นงาน score_logs (ข้าม)', 'warn'); }

                    // 3. requests_appeals
                    const sReq = getSheet('requests_appeals') || getSheet('request');
                    if (sReq) {
                        log(`กำลังเตรียมข้อมูลคำร้อง [${sReq}]...`);
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sReq], { header: 1, defval: "" });
                        for (let i = 1; i < rows.length; i++) {
                            let r = rows[i];
                            let reqId = cleanStr(r[0]);
                            if (!reqId || !r[3]) continue;
                            let dateStr = cleanStr(r[1]);
                            let data = {
                                dateStr: dateStr,
                                type: cleanStr(r[2]),
                                officialId: cleanStr(r[3]).replace(/\D/g, ''),
                                fullName: cleanStr(r[4]),
                                categoryId: cleanStr(r[5]),
                                activityName: cleanStr(r[6]),
                                detail: cleanStr(r[7]),
                                reqScore: cleanNum(r[8]),
                                fileUrl: cleanStr(r[9]),
                                statTam: cleanStr(r[10]),
                                statDist: cleanStr(r[11]),
                                approvedScore: cleanNum(r[12]),
                                refLogId: cleanStr(r[13]),
                                timestamp: dateStr ? firebase.firestore.Timestamp.fromDate(new Date(dateStr)) : firebase.firestore.FieldValue.serverTimestamp()
                            };
                            operations.push({ ref: db.collection(`${basePath}/requests`).doc(reqId), data });
                        }
                    } else { log('ไม่พบแผ่นงาน requests_appeals (ข้าม)', 'warn'); }

                    // 4. user_config
                    const sUser = getSheet('user_config') || getSheet('config');
                    if (sUser) {
                        log(`กำลังเตรียมข้อมูลผู้ดูแลระบบ [${sUser}]...`);
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sUser], { header: 1, defval: "" });
                        for (let i = 1; i < rows.length; i++) {
                            let r = rows[i];
                            let username = cleanStr(r[0]);
                            if (!username) continue;
                            let data = {
                                username: username,
                                password: cleanStr(r[1]),
                                role: cleanStr(r[2]),
                                filter: cleanStr(r[3]),
                                name: cleanStr(r[4])
                            };
                            operations.push({ ref: db.collection(`${basePath}/users_config`).doc(username), data });
                        }
                    } else { log('ไม่พบแผ่นงาน user_config (ข้าม)', 'warn'); }

                    if (operations.length === 0) {
                        throw new Error("ไม่พบข้อมูลในแผ่นงานใดๆ เลย กรุณาตรวจสอบไฟล์");
                    }

                    document.getElementById('progressText').innerText = `กำลังอัปโหลดเข้าเซิร์ฟเวอร์...`;
                    document.getElementById('progressBar').style.width = `50%`;
                    log(`=================================`, 'info');
                    log(`เตรียมส่งข้อมูลจำนวน ${operations.length} รายการ ขึ้นฐานข้อมูล...`, 'success');
                    
                    await commitBatches(operations);

                    document.getElementById('progressBar').style.width = `100%`;
                    document.getElementById('progressText').innerText = `อัปโหลดสมบูรณ์!`;
                    log(`🎉 นำเข้าข้อมูลทั้ง ${operations.length} รายการ เสร็จสมบูรณ์!`, 'success');
                    
                    btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> นำเข้าข้อมูลสำเร็จ 100%';
                    btn.classList.replace('bg-indigo-600', 'bg-emerald-600');
                    btn.classList.replace('hover:bg-indigo-700', 'hover:bg-emerald-700');
                    
                    Swal.fire({
                        title: 'ยอดเยี่ยม!',
                        text: 'อัปโหลดฐานข้อมูลขึ้น Firebase เรียบร้อยแล้ว ตอนนี้ระบบ DOPA NASAN Score พร้อมใช้งานเต็มรูปแบบครับ!',
                        icon: 'success',
                        confirmButtonColor: '#4f46e5'
                    }).then(() => {
                        window.location.href = "index.html"; // กลับไปหน้าแรกทันที
                    });

                } catch (err) {
                    log(`ข้อผิดพลาดการอ่านข้อมูล: ${err.message}`, 'error');
                    btn.innerHTML = 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';
                    btn.classList.replace('bg-indigo-600', 'bg-red-600');
                    btn.disabled = false;
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
