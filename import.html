<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นำเข้าฐานข้อมูล DOPA NASAN Score 2570 (V.Max)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style> 
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; } 
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-3xl border-t-4 border-emerald-500">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-2xl"><i class="fa-solid fa-database"></i></div>
            <div>
                <h2 class="text-2xl font-bold text-slate-800">เครื่องมือนำเข้าข้อมูล (V.Max)</h2>
                <p class="text-sm text-slate-500">ทนทานต่อข้อมูลว่างเปล่าและรูปแบบวันที่ผิดปกติ</p>
            </div>
        </div>
        
        <div id="authWarning" class="hidden mt-4 mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl">
            <h3 class="text-red-800 font-bold text-sm"><i class="fa-solid fa-triangle-exclamation"></i> ติดปัญหาการเชื่อมต่อ / สิทธิ์เข้าถึง</h3>
            <p class="text-sm text-red-600 mt-1" id="authErrorText"></p>
        </div>

        <div class="mt-6">
            <input type="file" id="excelFile" accept=".xlsx, .xls" class="w-full p-4 border-2 border-dashed border-slate-300 rounded-xl mb-4 bg-slate-50 cursor-pointer text-sm font-bold text-slate-600 hover:bg-emerald-50 hover:border-emerald-400 transition outline-none">
            
            <button onclick="startImport()" id="importBtn" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition shadow-lg active:scale-95 text-base flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> เริ่มอ่านไฟล์และนำเข้าข้อมูล
            </button>
        </div>

        <div id="statusArea" class="mt-8 hidden">
            <div class="flex justify-between text-sm font-bold text-slate-700 mb-2">
                <span>ความคืบหน้าการอัปโหลด:</span>
                <span id="progressText" class="text-emerald-600">กำลังเตรียมการ...</span>
            </div>
            
            <div class="w-full bg-slate-100 rounded-full h-3 mb-3 shadow-inner overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-emerald-400 to-emerald-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <div id="logArea" class="p-4 bg-slate-900 text-emerald-400 font-mono text-[11px] md:text-xs h-64 overflow-y-auto rounded-xl custom-scroll shadow-inner leading-relaxed"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBPC8Wcv5InhI9O-2aMfvclF3fBtqSo1xo",
          authDomain: "dopa-nasan-score.firebaseapp.com",
          projectId: "dopa-nasan-score",
          storageBucket: "dopa-nasan-score.firebasestorage.app",
          messagingSenderId: "678813152611",
          appId: "1:678813152611:web:959239d16e296a16cc0f56",
          measurementId: "G-4QN247NQTT"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const basePath = `artifacts/dopa-nasan-score/public/data`;

        function log(msg, type='normal') {
            const l = document.getElementById('logArea');
            let color = 'text-emerald-400';
            if (type === 'error') color = 'text-red-400 font-bold';
            if (type === 'info') color = 'text-sky-300';
            if (type === 'warn') color = 'text-amber-300';
            if (type === 'success') color = 'text-yellow-300 font-bold';
            l.innerHTML += `<div class="${color} mb-1.5">> ${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }

        // ฟังก์ชันทำความสะอาดข้อมูลขั้นสุดยอด (ป้องกัน Undefined เด็ดขาด)
        const cleanStr = (val) => (val === undefined || val === null) ? "" : String(val).trim();
        const cleanNum = (val) => isNaN(parseFloat(val)) ? 0 : parseFloat(val);

        // ฟังก์ชันแปลงวันที่ให้ปลอดภัย ไม่พัง 100%
        function getSafeTimestamp(dateString) {
            if (!dateString) return firebase.firestore.FieldValue.serverTimestamp();
            try {
                let d = new Date(dateString);
                if (!isNaN(d.getTime())) return firebase.firestore.Timestamp.fromDate(d);
                
                // ถ้ารูปแบบแปลกๆ เช่น 21/08/2026 ให้พยายามสลับ
                let parts = dateString.split(/[-/]/);
                if (parts.length === 3) {
                    d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                    if (!isNaN(d.getTime())) return firebase.firestore.Timestamp.fromDate(d);
                }
            } catch(e) {}
            // ถ้าพังหมดให้ใช้วันที่ของเซิร์ฟเวอร์ปัจจุบันแทน
            return firebase.firestore.FieldValue.serverTimestamp();
        }

        async function startImport() {
            const fileInput = document.getElementById('excelFile');
            if (!fileInput.files.length) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกไฟล์ Excel ก่อนครับ', 'warning');

            const btn = document.getElementById('importBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบระบบ...';
            document.getElementById('statusArea').classList.remove('hidden');
            document.getElementById('authWarning').classList.add('hidden');
            document.getElementById('logArea').innerHTML = '';

            try {
                await auth.signInAnonymously();
                log('✅ เชื่อมต่อ Firebase สำเร็จ (Anonymous Auth Active)', 'success');
            } catch (error) {
                document.getElementById('authWarning').classList.remove('hidden');
                document.getElementById('authErrorText').innerHTML = `สิทธิ์เข้าถึงถูกปฏิเสธ: ${error.message} <br><br><b>วิธีแก้:</b> ไปที่เว็บ Firebase > Authentication > Sign-in method > เปิดใช้งาน <b>Anonymous (ไม่ระบุตัวตน)</b> ครับ`;
                btn.innerHTML = 'เกิดข้อผิดพลาด';
                btn.classList.replace('bg-emerald-600', 'bg-red-600');
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังอ่านและคัดกรองข้อมูล...';

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    // ใช้ raw: false เพื่อให้ดึงข้อมูลออกมาเป็นตัวหนังสือล้วนๆ (แก้ปัญหา Date พัง)
                    const workbook = XLSX.read(data, {type: 'array'});
                    log(`พบแผ่นงานทั้งหมด: ${workbook.SheetNames.join(', ')}`, 'info');
                    
                    let operations = [];
                    const getSheet = (keyword) => workbook.SheetNames.find(n => n.toLowerCase().includes(keyword.toLowerCase()));

                    // 1. bookkon
                    const sBookkon = getSheet('bookkon');
                    if (sBookkon) {
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sBookkon], { header: 1, raw: false, defval: "" });
                        for (let i = 1; i < rows.length; i++) {
                            let r = rows[i];
                            let idCard = cleanStr(r[0]).replace(/\D/g, '');
                            if (!idCard) continue;
                            
                            let moo = cleanStr(r[6]).replace(/\D/g, '');
                            let rawVillage = cleanStr(r[7]);
                            
                            let docData = {
                                idCard: idCard,
                                fullName: cleanStr(r[1]),
                                position: cleanStr(r[2]),
                                moo: moo,
                                rawVillage: rawVillage,
                                village: rawVillage ? `หมู่ที่ ${moo} ${rawVillage}` : '',
                                subdistrict: cleanStr(r[8]),
                                totalScore: cleanNum(r[17])
                            };
                            operations.push({ ref: db.collection(`${basePath}/officials`).doc(idCard), data: docData, name: `บุคลากร: ${docData.fullName}` });
                        }
                    }

                    // 2. user_config
                    const sUser = getSheet('user_config') || getSheet('config');
                    if (sUser) {
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sUser], { header: 1, raw: false, defval: "" });
                        for (let i = 1; i < rows.length; i++) {
                            let r = rows[i];
                            let username = cleanStr(r[0]);
                            if (!username) continue;
                            
                            let docData = {
                                username: username,
                                password: cleanStr(r[1]),
                                role: cleanStr(r[2]),
                                filter: cleanStr(r[3]),
                                name: cleanStr(r[4])
                            };
                            operations.push({ ref: db.collection(`${basePath}/users_config`).doc(username), data: docData, name: `ผู้ใช้: ${username}` });
                        }
                    }

                    // 3. score_logs
                    const sScore = getSheet('score_logs');
                    if (sScore) {
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sScore], { header: 1, raw: false, defval: "" });
                        for (let i = 1; i < rows.length; i++) {
                            let r = rows[i];
                            if (!cleanStr(r[2])) continue;
                            
                            let dateStr = cleanStr(r[1]);
                            let docData = {
                                dateStr: dateStr,
                                idCard: cleanStr(r[2]).replace(/\D/g, ''),
                                fullName: cleanStr(r[3]),
                                categoryId: cleanStr(r[4]),
                                activityName: cleanStr(r[5]),
                                activityDetail: cleanStr(r[6]),
                                score: cleanNum(r[7]),
                                type: cleanStr(r[8]),
                                recordedBy: cleanStr(r[9]),
                                proofUrl: cleanStr(r[10]),
                                timestamp: getSafeTimestamp(dateStr)
                            };
                            operations.push({ ref: db.collection(`${basePath}/score_logs`).doc(), data: docData, name: `ประวัติ: ${docData.fullName}` });
                        }
                    }

                    // 4. requests_appeals
                    const sReq = getSheet('requests_appeals') || getSheet('request');
                    if (sReq) {
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sReq], { header: 1, raw: false, defval: "" });
                        for (let i = 1; i < rows.length; i++) {
                            let r = rows[i];
                            let reqId = cleanStr(r[0]);
                            if (!reqId || !cleanStr(r[3])) continue;
                            
                            let dateStr = cleanStr(r[1]);
                            let docData = {
                                dateStr: dateStr,
                                type: cleanStr(r[2]),
                                officialId: cleanStr(r[3]).replace(/\D/g, ''),
                                fullName: cleanStr(r[4]),
                                categoryId: cleanStr(r[5]),
                                activityName: cleanStr(r[6]),
                                detail: cleanStr(r[7]),
                                reqScore: cleanNum(r[8]),
                                fileUrl: cleanStr(r[9]),
                                statTam: cleanStr(r[10]),
                                statDist: cleanStr(r[11]),
                                approvedScore: cleanNum(r[12]),
                                refLogId: cleanStr(r[13]),
                                timestamp: getSafeTimestamp(dateStr)
                            };
                            operations.push({ ref: db.collection(`${basePath}/requests`).doc(reqId), data: docData, name: `คำร้อง: ${docData.fullName}` });
                        }
                    }

                    const total = operations.length;
                    if (total === 0) throw new Error("ไม่พบข้อมูลที่ถูกต้องในไฟล์ Excel ครับ");

                    log(`=================================`, 'info');
                    log(`🚀 กำลังส่งข้อมูลทีละรายการจำนวน ${total} ชุด สู่ Firebase...`, 'success');
                    
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังเขียนฐานข้อมูล...';
                    
                    let successCount = 0;
                    let errorCount = 0;

                    // เขียนทีละแถว (Sequential) เพื่อป้องกัน Batch Limit และป้องกันแถวพังดึงทั้งระบบร่วง
                    for (let i = 0; i < total; i++) {
                        let op = operations[i];
                        try {
                            await op.ref.set(op.data);
                            successCount++;
                            
                            // อัปเดต UI ทุกๆ 5 รายการ เพื่อไม่ให้เบราว์เซอร์ค้าง
                            if (successCount % 5 === 0 || i === total - 1) {
                                document.getElementById('progressText').innerText = `${successCount} / ${total}`;
                                document.getElementById('progressBar').style.width = `${(successCount/total)*100}%`;
                            }
                        } catch (err) {
                            errorCount++;
                            log(`[ล้มเหลว] ${op.name} -> ${err.message}`, 'error');
                        }
                    }

                    document.getElementById('progressBar').style.width = `100%`;
                    
                    if (errorCount > 0) {
                        log(`⚠️ เสร็จสิ้น แต่พบข้อผิดพลาด ${errorCount} รายการ (บันทึกสำเร็จ ${successCount} รายการ)`, 'warn');
                        btn.innerHTML = 'นำเข้าสำเร็จบางส่วน (เช็ค Log)';
                        btn.classList.replace('bg-emerald-600', 'bg-amber-500');
                        btn.classList.replace('hover:bg-emerald-700', 'hover:bg-amber-600');
                    } else {
                        log(`🎉 อัปโหลดสำเร็จสมบูรณ์ทั้ง ${successCount} รายการ!`, 'success');
                        btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> นำเข้าข้อมูลสำเร็จ 100%';
                    }
                    
                    Swal.fire({
                        title: errorCount > 0 ? 'สำเร็จบางส่วน' : 'ยอดเยี่ยม!',
                        text: `อัปโหลดฐานข้อมูลเสร็จสิ้น สำเร็จ ${successCount} รายการ${errorCount > 0 ? ` (ไม่สำเร็จ ${errorCount} รายการ)` : ''}`,
                        icon: errorCount > 0 ? 'warning' : 'success',
                        confirmButtonText: 'ไปหน้าหลักระบบ',
                        confirmButtonColor: '#10b981'
                    }).then(() => {
                        window.location.href = "index.html"; 
                    });

                } catch (err) {
                    log(`ข้อผิดพลาดขั้นวิกฤต: ${err.message}`, 'error');
                    btn.innerHTML = 'เกิดข้อผิดพลาดรุนแรง';
                    btn.classList.replace('bg-emerald-600', 'bg-red-600');
                    btn.disabled = false;
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
