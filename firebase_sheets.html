<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Sheets V11 - Exact Fields</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBPC8Wcv5InhI9O-2aMfvclF3fBtqSo1xo",
          authDomain: "dopa-nasan-score.firebaseapp.com",
          projectId: "dopa-nasan-score",
          storageBucket: "dopa-nasan-score.firebasestorage.app",
          messagingSenderId: "678813152611",
          appId: "1:678813152611:web:959239d16e296a16cc0f56",
          measurementId: "G-4QN247NQTT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const basePath = `artifacts/dopa-nasan-score/public/data`;

        const schemas = {
            user_config: {
                docIdField: 'Username',
                cols: [
                    { key: 'Username', label: 'Username' },
                    { key: 'Password', label: 'Password' },
                    { key: 'Role', label: 'Role' },
                    { key: 'Filter', label: 'Filter' },
                    { key: 'DisplayName', label: 'DisplayName' }
                ]
            },
            officials: {
                docIdField: 'idCard',
                cols: [
                    { key: 'idCard', label: 'เลขประจำตัวประชาชน' },
                    { key: 'fullName', label: 'ชื่อ-สกุล' },
                    { key: 'position', label: 'ตำแหน่ง' },
                    { key: 'moo', label: 'หมู่ที่' },
                    { key: 'rawVillage', label: 'ชื่อบ้าน' },
                    { key: 'subdistrict', label: 'ตำบล' },
                    { key: 'totalScore', label: 'คะแนนรวม' }
                ]
            },
            score_logs: {
                docIdField: null,
                cols: [
                    { key: 'dateStr', label: 'วันที่ (Date)' },
                    { key: 'idCard', label: 'เลขประจำตัวประชาชน' },
                    { key: 'fullName', label: 'ชื่อ-สกุล' },
                    { key: 'categoryId', label: 'หมวดหมู่' },
                    { key: 'activityName', label: 'ชื่อกิจกรรม' },
                    { key: 'score', label: 'คะแนน' },
                    { key: 'type', label: 'ประเภท (+/-)' },
                    { key: 'recordedBy', label: 'ผู้บันทึก' }
                ]
            },
            requests_appeals: {
                docIdField: 'ReqID',
                cols: [
                    { key: 'ReqID', label: 'ReqID' },
                    { key: 'Timestamp', label: 'Timestamp' },
                    { key: 'Type', label: 'Type' },
                    { key: 'ID_Card', label: 'ID_Card' },
                    { key: 'FullName', label: 'FullName' },
                    { key: 'Category', label: 'Category' },
                    { key: 'ActivityName', label: 'ActivityName' },
                    { key: 'RequestedScore', label: 'RequestedScore' },
                    { key: 'StatusTambon', label: 'StatusTambon' },
                    { key: 'StatusDistrict', label: 'StatusDistrict' }
                ]
            }
        };

        let currentTable = 'user_config';
        let tableData = [];

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await signInAnonymously(auth);
                document.getElementById('authStatus').innerHTML = '<i class="fa-solid fa-check text-green-400"></i> เชื่อมต่อสำเร็จ';
                fetchData();
            } catch (err) {
                document.getElementById('authStatus').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400"></i> ล็อกอินไม่สำเร็จ`;
            }
        });

        window.switchTable = function() {
            currentTable = document.getElementById('tableSelector').value;
            fetchData();
        }

        window.fetchData = async function() {
            Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            tableData = [];
            try {
                const querySnapshot = await getDocs(collection(db, `${basePath}/${currentTable}`));
                querySnapshot.forEach((document) => {
                    let data = document.data();
                    let schema = schemas[currentTable];
                    let rowObj = {};
                    
                    // ดึงค่าตาม Schema โดยตรงหรือดึงแบบยืดหยุ่นถ้าข้อมูลเก่ามีรูปแบบต่างกัน
                    schema.cols.forEach(c => {
                        rowObj[c.key] = data[c.key] !== undefined ? data[c.key] : (data[c.key.toLowerCase()] !== undefined ? data[c.key.toLowerCase()] : '');
                    });

                    if (schema.docIdField && !rowObj[schema.docIdField]) {
                        rowObj[schema.docIdField] = document.id;
                    }
                    tableData.push(rowObj);
                });
                renderTable();
                Swal.close();
            } catch (err) {
                Swal.fire('ข้อผิดพลาด', err.message, 'error');
            }
        }

        window.renderTable = function() {
            const schema = schemas[currentTable];
            const thead = document.getElementById('tHead');
            const tbody = document.getElementById('tBody');
            
            let thHtml = '<tr><th class="w-12">No.</th>';
            schema.cols.forEach(c => { thHtml += `<th class="p-3">${c.label}</th>`; });
            thHtml += '<th class="w-12">ลบ</th></tr>';
            thead.innerHTML = thHtml;

            let tbHtml = '';
            tableData.forEach((row, rowIndex) => {
                tbHtml += `<tr><td class="row-num">${rowIndex + 1}</td>`;
                schema.cols.forEach(c => {
                    let val = row[c.key] !== undefined ? row[c.key] : '';
                    tbHtml += `<td class="p-1"><input type="text" class="sheet-input" value="${val}" onchange="updateCell(${rowIndex}, '${c.key}', this.value)"></td>`;
                });
                tbHtml += `<td class="text-center bg-slate-50"><button onclick="deleteRow(${rowIndex})" class="text-red-400 hover:text-red-600 px-3 py-2"><i class="fa-solid fa-times"></i></button></td></tr>`;
            });
            tbody.innerHTML = tbHtml;
            document.getElementById('recordCount').innerText = `จำนวน: ${tableData.length} แถว`;
        }

        window.updateCell = function(rowIndex, key, value) {
            tableData[rowIndex][key] = value;
        }

        window.addRow = function() {
            let newRow = {};
            schemas[currentTable].cols.forEach(c => newRow[c.key] = '');
            tableData.push(newRow);
            renderTable();
            document.getElementById('tableWrapper').scrollTop = document.getElementById('tableWrapper').scrollHeight;
        }

        window.deleteRow = function(index) {
            tableData.splice(index, 1);
            renderTable();
        }

        window.openPasteModal = function() {
            const schema = schemas[currentTable];
            document.getElementById('expectedColumnsLabel').innerText = `ลำดับคอลัมน์ที่ต้องก๊อปปี้: ` + schema.cols.map(c => c.label).join(' | ');
            document.getElementById('pasteArea').value = '';
            document.getElementById('pasteModal').classList.remove('hidden');
        }

        window.closePasteModal = function() {
            document.getElementById('pasteModal').classList.add('hidden');
        }

        window.processPaste = function() {
            const text = document.getElementById('pasteArea').value;
            if (!text.trim()) { closePasteModal(); return; }

            const rows = text.split('\n');
            const schema = schemas[currentTable];
            let added = 0;

            rows.forEach(r => {
                if (!r.trim()) return;
                const cells = r.split('\t'); 
                let newObj = {};
                schema.cols.forEach((col, index) => {
                    let val = (cells[index] || '').replace(/^"|"$/g, '').trim();
                    newObj[col.key] = val;
                });
                if (Object.values(newObj).some(v => v !== '')) {
                    tableData.push(newObj);
                    added++;
                }
            });

            renderTable();
            closePasteModal();
            Swal.fire('สำเร็จ', `นำเข้าข้อมูลลงตารางสำเร็จ ${added} แถว`, 'success');
        }

        window.saveToFirebase = async function() {
            if (tableData.length === 0) return Swal.fire('เตือน', 'ไม่มีข้อมูลให้บันทึก', 'warning');

            const result = await Swal.fire({
                title: 'ยืนยันการบันทึก?',
                text: `กำลังบันทึกข้อมูลตาราง ${currentTable} จำนวน ${tableData.length} แถว`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#10b981'
            });

            if (!result.isConfirmed) return;

            Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const schema = schemas[currentTable];
            try {
                const batch = writeBatch(db);
                tableData.forEach((row, i) => {
                    let docId = schema.docIdField ? row[schema.docIdField] : null;
                    if (!docId) docId = 'ID-' + Date.now() + '-' + i;
                    
                    const ref = doc(db, `${basePath}/${currentTable}`, String(docId));
                    let finalData = { ...row };
                    
                    if (currentTable === 'officials') {
                        let cleanId = String(row.idCard || '').replace(/\D/g, '');
                        finalData.idCard = cleanId;
                        finalData.totalScore = parseFloat(row.totalScore) || 0;
                    }

                    batch.set(ref, finalData);
                });

                await batch.commit();
                Swal.fire('สำเร็จ', 'บันทึกข้อมูลขึ้น Firebase เรียบร้อยแล้ว', 'success');
                fetchData();
            } catch (err) {
                Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
            }
        }
    </script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        .sheet-table { border-collapse: collapse; width: 100%; background: white; min-width: 700px; }
        .sheet-table th { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 10px; font-size: 13px; font-weight: bold; text-align: center; color: #475569; position: sticky; top: 0; z-index: 10; }
        .sheet-table td { border: 1px solid #cbd5e1; padding: 4px; position: relative; }
        .sheet-input { width: 100%; min-height: 36px; border: 1px solid transparent; padding: 6px 10px; font-size: 14px; outline: none; background: transparent; border-radius: 4px; }
        .sheet-input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2); background: #ffffff; }
        .row-num { background: #f8fafc; text-align: center; font-size: 12px; color: #94a3b8; width: 50px; font-weight: bold; user-select: none; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body>

    <header class="bg-indigo-700 text-white p-3 flex justify-between items-center flex-none shadow-md">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-table-cells text-2xl text-indigo-300"></i>
            <div>
                <h1 class="font-bold text-lg leading-tight">Firebase Sheets V11 (Exact Fields)</h1>
                <p id="authStatus" class="text-[10px] text-indigo-200">กำลังเชื่อมต่อ...</p>
            </div>
        </div>
        <button onclick="window.location.href='index.html'" class="bg-indigo-800 px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-house"></i> หน้าหลัก</button>
    </header>

    <div class="bg-white border-b border-slate-200 p-2 flex gap-2 flex-none items-center shadow-sm overflow-x-auto">
        <select id="tableSelector" onchange="switchTable()" class="bg-slate-50 border border-slate-300 text-sm rounded-lg p-2 font-bold outline-none cursor-pointer">
            <option value="user_config">⚙️ ผู้ดูแลระบบ (user_config)</option>
            <option value="officials">👥 บุคลากร (officials)</option>
            <option value="score_logs">⭐ ประวัติคะแนน (score_logs)</option>
            <option value="requests_appeals">📝 คำร้องอุทธรณ์ (requests_appeals)</option>
        </select>
        <button onclick="fetchData()" class="bg-slate-100 px-3 py-2 rounded-lg text-xs font-bold"><i class="fa-solid fa-rotate"></i> โหลด</button>
        <button onclick="addRow()" class="bg-slate-100 px-3 py-2 rounded-lg text-xs font-bold"><i class="fa-solid fa-plus text-green-600"></i> เพิ่มแถว</button>
        <button onclick="openPasteModal()" class="bg-amber-100 text-amber-800 px-3 py-2 rounded-lg text-xs font-bold border"><i class="fa-solid fa-clipboard-list"></i> วางข้อมูลด่วนจาก Excel (Paste)</button>
        <div class="flex-grow"></div>
        <button onclick="saveToFirebase()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md"><i class="fa-solid fa-cloud-arrow-up"></i> บันทึกขึ้น Firebase</button>
    </div>

    <main class="flex-grow overflow-auto bg-slate-100 custom-scroll relative" id="tableWrapper">
        <table class="sheet-table" id="mainTable">
            <thead id="tHead"></thead>
            <tbody id="tBody"></tbody>
        </table>
    </main>

    <footer class="bg-slate-800 text-slate-300 p-1.5 text-[10px] flex justify-between flex-none">
        <span id="recordCount">จำนวน: 0 แถว</span>
    </footer>

    <!-- Paste Modal -->
    <div id="pasteModal" class="hidden fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl flex flex-col h-[80vh]">
            <div class="p-4 border-b flex justify-between bg-amber-50 rounded-t-2xl">
                <h3 class="font-bold text-amber-800"><i class="fa-solid fa-paste mr-2"></i>วางข้อมูลจาก Excel (Copy & Paste)</h3>
                <button onclick="closePasteModal()"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="p-4 flex-grow flex flex-col">
                <p class="text-xs font-bold text-indigo-600 mb-1" id="expectedColumnsLabel"></p>
                <textarea id="pasteArea" class="flex-grow w-full border rounded-xl p-3 text-xs font-mono outline-none bg-slate-50" placeholder="คลิกที่นี่แล้วกด Ctrl+V วางข้อมูล..."></textarea>
            </div>
            <div class="p-4 border-t bg-slate-50 rounded-b-2xl flex justify-end gap-2">
                <button onclick="closePasteModal()" class="px-4 py-2 border rounded-lg text-sm font-bold">ยกเลิก</button>
                <button onclick="processPaste()" class="px-4 py-2 bg-amber-500 text-white rounded-lg text-sm font-bold">นำลงตาราง</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
