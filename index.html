<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบ DOPA NASAN Score - อำเภอบ้านนาสาร</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (เปิดระบบ Storage สำหรับเก็บไฟล์ภาพ/PDF) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root">
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-indigo-600 font-bold text-lg animate-pulse">⏳ กำลังโหลดระบบ DOPA NASAN Score...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // เชื่อมต่อฐานข้อมูล Firebase ของปลัดปอ
        const firebaseConfig = {
          apiKey: "AIzaSyBPC8Wcv5InhI9O-2aMfvclF3fBtqSo1xo",
          authDomain: "dopa-nasan-score.firebaseapp.com",
          projectId: "dopa-nasan-score",
          storageBucket: "dopa-nasan-score.firebasestorage.app",
          messagingSenderId: "678813152611",
          appId: "1:678813152611:web:959239d16e296a16cc0f56",
          measurementId: "G-4QN247NQTT"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();
        
        const appId = 'dopa-nasan-score';
        const basePath = `artifacts/${appId}/public/data`;

        // ป้องกันจอขาวเมื่อมี Error
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) return (
                    <div className="p-8 m-4 bg-red-50 text-red-600 rounded-2xl shadow">
                        <h2 className="font-bold">⚠️ พบข้อผิดพลาด</h2>
                        <p>{this.state.error.message}</p>
                        <button onClick={() => window.location.reload()} className="mt-4 px-4 py-2 bg-red-600 text-white rounded-lg">โหลดใหม่</button>
                    </div>
                );
                return this.props.children;
            }
        }

        function App() {
            const [user, setUser] = useState(null);
            const [appUser, setAppUser] = useState(null);
            const [currentView, setCurrentView] = useState('dashboard');
            
            const [officials, setOfficials] = useState([]);
            const [usersDb, setUsersDb] = useState([]);
            const [requests, setRequests] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                auth.signInAnonymously().catch(console.error);
                const unsubscribeAuth = auth.onAuthStateChanged(async (u) => {
                    setUser(u);
                    if (u) {
                        db.collection(`${basePath}/officials`).onSnapshot(snap => setOfficials(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                        db.collection(`${basePath}/users_config`).onSnapshot(snap => setUsersDb(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                        db.collection(`${basePath}/requests`).orderBy('timestamp', 'desc').onSnapshot(snap => setRequests(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                        setLoading(false);
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            if (loading) return <div className="min-h-screen flex items-center justify-center text-indigo-600 font-bold">กำลังเชื่อมต่อฐานข้อมูล...</div>;

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800">
                    {currentView === 'dashboard' && <Dashboard officials={officials} onLogin={() => setCurrentView('login')} />}
                    {currentView === 'login' && <Login usersDb={usersDb} officials={officials} onLoginSuccess={(u, role) => { setAppUser(u); setCurrentView(role); }} onBack={() => setCurrentView('dashboard')} />}
                    {currentView === 'admin' && <AdminPanel appUser={appUser} officials={officials} requests={requests} db={db} basePath={basePath} onLogout={() => { setAppUser(null); setCurrentView('dashboard'); }} />}
                    {currentView === 'official' && <OfficialPanel appUser={appUser} db={db} basePath={basePath} storage={storage} requests={requests.filter(r => r.officialId === appUser.idCard)} onLogout={() => { setAppUser(null); setCurrentView('dashboard'); }} />}
                </div>
            );
        }

        // หน้า 1: Dashboard สรุปคะแนน
        function Dashboard({ officials, onLogin }) {
            const [filterSub, setFilterSub] = useState('');
            const subs = [...new Set(officials.map(o => o.subdistrict))].filter(Boolean).sort();
            const filtered = officials.filter(o => !filterSub || o.subdistrict === filterSub).sort((a, b) => (b.totalScore || 0) - (a.totalScore || 0));

            return (
                <div>
                    <header className="bg-gradient-to-br from-indigo-600 to-purple-800 text-white shadow-lg pb-12">
                        <div className="container mx-auto px-4 py-6 flex justify-between items-center">
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold">DOPA NASAN Score</h1>
                                <p className="text-indigo-200 text-sm">อำเภอบ้านนาสาร จังหวัดสุราษฎร์ธานี</p>
                            </div>
                            <button onClick={onLogin} className="bg-white/10 hover:bg-white/20 border border-white/30 px-4 py-2 rounded-full text-xs font-bold transition">
                                🔐 เข้าสู่ระบบ
                            </button>
                        </div>
                    </header>
                    <main className="container mx-auto px-4 -mt-8 pb-10">
                        <div className="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden">
                            <div className="p-4 bg-slate-50 border-b flex flex-col md:flex-row justify-between items-center gap-4">
                                <h2 className="text-lg font-bold text-slate-800">🏆 อันดับคะแนนรวม</h2>
                                <select value={filterSub} onChange={e => setFilterSub(e.target.value)} className="border p-2 rounded-xl text-sm w-full md:w-auto outline-none">
                                    <option value="">-- ทุกตำบล --</option>
                                    {subs.map(s => <option key={s} value={s}>ตำบล{s}</option>)}
                                </select>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-50 text-slate-500 text-xs uppercase border-b">
                                        <tr><th className="p-4 text-center">อันดับ</th><th className="p-4">ชื่อ - ตำแหน่ง</th><th className="p-4 text-center">คะแนน</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm">
                                        {filtered.length === 0 ? <tr><td colSpan="3" className="text-center p-8 text-slate-400">ยังไม่มีข้อมูล</td></tr> : 
                                            filtered.map((item, idx) => (
                                            <tr key={item.id} className="hover:bg-slate-50">
                                                <td className="p-4 text-center font-bold text-slate-400">{idx + 1}</td>
                                                <td className="p-4"><div className="font-bold text-slate-800">{item.fullName}</div><div className="text-xs text-slate-500 mt-1">{item.position} • {item.village} ต.{item.subdistrict}</div></td>
                                                <td className="p-4 text-center font-bold text-xl text-indigo-600">{item.totalScore || 0}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        // หน้า 2: Login
        function Login({ usersDb, officials, onLoginSuccess, onBack }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const admin = usersDb.find(u => u.username === username && u.password === password);
                if (admin) { onLoginSuccess(admin, 'admin'); return; }
                const official = officials.find(o => o.idCard === username);
                if (official) { onLoginSuccess(official, 'official'); return; }
                alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (หากเป็นผู้ใหญ่บ้าน ให้กรอกเลขบัตร ปชช. ในช่องบนช่องเดียว)');
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm text-center">
                        <div className="text-4xl mb-4">🔐</div>
                        <h2 className="text-2xl font-bold mb-6">เข้าสู่ระบบ</h2>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input className="w-full p-3 border rounded-xl outline-none" placeholder="Username / เลขบัตร ปชช." value={username} onChange={e => setUsername(e.target.value)} required />
                            <input type="password" className="w-full p-3 border rounded-xl outline-none" placeholder="Password (สำหรับแอดมิน)" value={password} onChange={e => setPassword(e.target.value)} />
                            <button type="submit" className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-indigo-700">เข้าใช้งาน</button>
                        </form>
                        <button onClick={onBack} className="mt-6 text-sm text-slate-500 hover:text-indigo-600">← กลับหน้าหลัก</button>
                    </div>
                </div>
            );
        }

        // หน้า 3: แอดมิน (ให้คะแนน + ดูไฟล์แนบ)
        function AdminPanel({ appUser, officials, requests, db, basePath, onLogout }) {
            const [tab, setTab] = useState('score');
            const [selectedOfficial, setSelectedOfficial] = useState(null);
            const [scoreInput, setScoreInput] = useState('');
            const [reasonInput, setReasonInput] = useState('');

            const handleAddScore = async (e) => {
                e.preventDefault();
                try {
                    const addValue = parseInt(scoreInput);
                    await db.collection(`${basePath}/officials`).doc(selectedOfficial.idCard).update({
                        totalScore: (selectedOfficial.totalScore || 0) + addValue
                    });
                    alert('บันทึกคะแนนสำเร็จ!');
                    setSelectedOfficial(null); setScoreInput(''); setReasonInput('');
                } catch (error) { alert('ข้อผิดพลาด: ' + error.message); }
            };

            return (
                <div className="p-4 md:p-8 max-w-4xl mx-auto">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 gap-4">
                        <div>
                            <h2 className="font-bold text-lg text-indigo-700">ระบบจัดการ (Admin)</h2>
                            <p className="text-xs text-slate-500">{appUser.name}</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setTab('score')} className={`px-4 py-2 rounded-xl text-sm font-bold ${tab === 'score' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>ให้คะแนน</button>
                            <button onClick={() => setTab('requests')} className={`px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1 ${tab === 'requests' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                                คำร้อง {requests.length > 0 && <span className="bg-red-500 text-white px-2 py-0.5 rounded-full text-[10px]">{requests.length}</span>}
                            </button>
                            <button onClick={onLogout} className="text-red-500 text-sm font-bold px-4 py-2 bg-red-50 rounded-xl ml-2 md:ml-4">ออก</button>
                        </div>
                    </div>

                    {tab === 'score' && (
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
                            <h3 className="font-bold mb-4">เลือกบุคลากรเพื่อให้คะแนน</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {officials.map(o => (
                                    <div key={o.id} onClick={() => setSelectedOfficial(o)} className="p-4 border rounded-xl hover:border-indigo-500 hover:bg-indigo-50 cursor-pointer flex justify-between items-center transition">
                                        <div><div className="font-bold">{o.fullName}</div><div className="text-xs text-slate-500">{o.position} ต.{o.subdistrict}</div></div>
                                        <div className="font-bold text-lg text-indigo-600">{o.totalScore || 0}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {tab === 'requests' && (
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
                            <h3 className="font-bold mb-4">รายการคำร้องและหลักฐานที่ส่งมา</h3>
                            <div className="space-y-3">
                                {requests.length === 0 ? <p className="text-sm text-slate-500 text-center py-4">ไม่มีรายการคำร้อง</p> : 
                                requests.map(req => {
                                    const off = officials.find(o => o.idCard === req.officialId) || {};
                                    return (
                                    <div key={req.id} className="p-4 border rounded-xl bg-slate-50 shadow-sm">
                                        <div className="flex justify-between mb-2">
                                            <div className="font-bold text-slate-800">{off.fullName || req.officialId}</div>
                                            <div className="text-xs text-slate-500">{req.timestamp ? new Date(req.timestamp.toDate()).toLocaleString('th-TH') : 'กำลังส่ง...'}</div>
                                        </div>
                                        <p className="text-sm text-slate-600 mb-3">{req.detail}</p>
                                        {req.fileUrl && (
                                            <a href={req.fileUrl} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 text-sm bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-200 font-bold transition">
                                                📎 เปิดดูไฟล์แนบ
                                            </a>
                                        )}
                                    </div>
                                )})}
                            </div>
                        </div>
                    )}

                    {/* หน้าต่างเด้งให้คะแนน */}
                    {selectedOfficial && tab === 'score' && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-6 rounded-3xl shadow-xl w-full max-w-md">
                                <h3 className="font-bold text-lg mb-4">ให้คะแนน: {selectedOfficial.fullName}</h3>
                                <form onSubmit={handleAddScore} className="space-y-4">
                                    <input type="number" className="w-full p-3 border rounded-xl outline-none" placeholder="คะแนน (เช่น 5 หรือ -2)" value={scoreInput} onChange={e => setScoreInput(e.target.value)} required />
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setSelectedOfficial(null)} className="w-full py-3 bg-slate-100 rounded-xl font-bold">ยกเลิก</button>
                                        <button type="submit" className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold">บันทึก</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // หน้า 4: ผู้ใช้งาน (กำนัน/ผู้ใหญ่บ้าน ส่งไฟล์)
        function OfficialPanel({ appUser, db, basePath, storage, requests, onLogout }) {
            const [detail, setDetail] = useState('');
            const [file, setFile] = useState(null);
            const [uploading, setUploading] = useState(false);

            const handleSubmitRequest = async (e) => {
                e.preventDefault();
                if (!detail) return alert('กรุณากรอกรายละเอียด');
                setUploading(true);
                
                try {
                    let fileUrl = '';
                    // ถัามีการอัปโหลดไฟล์ จะวิ่งเข้า Firebase Storage ทันที!
                    if (file) {
                        const fileRef = storage.ref(`evidence/${appUser.idCard}/${Date.now()}_${file.name}`);
                        await fileRef.put(file);
                        fileUrl = await fileRef.getDownloadURL();
                    }

                    // บันทึกข้อความลง Firestore
                    await db.collection(`${basePath}/requests`).add({
                        officialId: appUser.idCard,
                        detail: detail,
                        fileUrl: fileUrl,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert('ส่งคำร้องและไฟล์สำเร็จแล้ว!');
                    setDetail(''); setFile(null);
                    document.getElementById('fileUpload').value = '';
                } catch (error) {
                    alert('ข้อผิดพลาดในการส่งข้อมูล: ' + error.message);
                }
                setUploading(false);
            };

            return (
                <div className="p-4 max-w-xl mx-auto min-h-screen">
                    <div className="bg-white p-6 rounded-3xl shadow-lg text-center border-t-4 border-indigo-600 mb-6 mt-4">
                        <div className="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">👤</div>
                        <h2 className="text-xl font-bold text-slate-800">{appUser.fullName}</h2>
                        <p className="text-slate-500 text-sm mb-4">{appUser.position} | ต.{appUser.subdistrict}</p>
                        <div className="bg-slate-50 py-4 rounded-2xl border border-slate-100">
                            <p className="text-sm font-bold text-slate-500">คะแนนสะสมของคุณ</p>
                            <p className="text-4xl font-bold text-indigo-600 mt-1">{appUser.totalScore || 0}</p>
                        </div>
                        <button onClick={onLogout} className="mt-4 text-sm text-red-500 font-bold">ออกจากระบบ</button>
                    </div>

                    <div className="bg-white p-6 rounded-3xl shadow-lg border border-slate-100">
                        <h3 className="font-bold text-lg mb-1">ส่งหลักฐานผลงาน / คำร้อง</h3>
                        <p className="text-xs text-slate-500 mb-4">พิมพ์รายละเอียดและแนบรูปภาพหรือไฟล์ PDF เพื่อให้กรรมการพิจารณาคะแนน</p>
                        
                        <form onSubmit={handleSubmitRequest} className="space-y-4">
                            <textarea className="w-full p-3 border rounded-xl text-sm outline-none" rows="3" placeholder="รายละเอียดผลงาน หรือเหตุผลที่ขออุทธรณ์..." value={detail} onChange={e => setDetail(e.target.value)} required></textarea>
                            
                            <div className="border border-dashed border-slate-300 p-4 rounded-xl bg-slate-50 text-center">
                                <label className="block text-sm font-bold text-indigo-600 cursor-pointer mb-2">📎 คลิกเพื่อแนบไฟล์ (รูปภาพ / PDF)</label>
                                <input type="file" id="fileUpload" className="w-full text-xs text-slate-500" accept="image/*,.pdf" onChange={e => setFile(e.target.files[0])} />
                            </div>

                            <button type="submit" disabled={uploading} className={`w-full py-3 rounded-xl font-bold text-white shadow-md transition ${uploading ? 'bg-slate-400' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                                {uploading ? '⏳ กำลังส่งข้อมูลและอัปโหลดไฟล์...' : 'ส่งข้อมูลให้แอดมิน'}
                            </button>
                        </form>

                        {requests.length > 0 && (
                            <div className="mt-8">
                                <h4 className="font-bold text-sm mb-3">ประวัติการส่งคำร้องของคุณ</h4>
                                <div className="space-y-2">
                                    {requests.map(req => (
                                        <div key={req.id} className="p-3 bg-slate-50 border rounded-xl text-sm flex justify-between items-center">
                                            <div className="truncate pr-4 text-slate-600">{req.detail}</div>
                                            {req.fileUrl ? <a href={req.fileUrl} target="_blank" rel="noreferrer" className="text-indigo-600 font-bold text-xs whitespace-nowrap">ดูไฟล์</a> : <span className="text-xs text-slate-400">ไม่มีไฟล์</span>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
